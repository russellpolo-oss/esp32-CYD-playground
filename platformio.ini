
[env:system_monitor]
platform = espressif32
board = esp32dev
framework = arduino

build_src_filter =
    +<sysmon.cpp>

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341



